<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Chatbot — Google ADK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
    }

    header {
      padding: 14px 20px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }
    header h1 span { color: #6366f1; }
    #status { font-size: 0.78rem; color: #22c55e; }

    #toolbar {
      padding: 6px 16px;
      background: #0f172a;
      font-size: 0.75rem;
      color: #475569;
      border-bottom: 1px solid #1e293b;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user      { align-self: flex-end;   align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .msg.system    { align-self: center;     align-items: center; }

    .label { font-size: 0.7rem; color: #64748b; margin-bottom: 3px; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #6366f1; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #334155; color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg.system .bubble {
      background: transparent; color: #64748b;
      font-size: 0.78rem; font-style: italic;
    }

    #controls {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #text-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
    }
    #text-input:focus { border-color: #6366f1; }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    #send-btn { background: #6366f1; color: #fff; }
    #mic-btn  { background: #10b981; color: #fff; }
    #mic-btn.recording { background: #ef4444; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🎙️ Voice Chatbot <span>ADK</span></h1>
      <span id="status">Connecting…</span>
    </header>

    <div id="toolbar">
      English-only · Gemini Live Native Audio · Type or speak freely
    </div>

    <div id="chat-box"></div>

    <div id="controls">
      <input id="text-input" type="text" placeholder="Type a message and press Enter…" autocomplete="off" />
      <button id="send-btn">Send</button>
      <button id="mic-btn">🎙️ Mic</button>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
